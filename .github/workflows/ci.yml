name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install the Rust toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2.9.3

      - name: cargo fmt
        run: cargo fmt --check

      - name: cargo clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

  test:
    name: Tests (Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: sei_monitor
          POSTGRES_USER: sei_monitor
          POSTGRES_PASSWORD: sei_monitor
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sei_monitor -d sei_monitor"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://sei_monitor:sei_monitor@localhost:5432/sei_monitor?sslmode=disable
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install the Rust toolchain
        run: rustup toolchain install

      - uses: actions/setup-go@v7
        with:
          go-version: 1.27.2
          cache: false

      - name: Install the conformance command
        run: |
          GOBIN="$RUNNER_TEMP/bin" go install github.com/ItzTas/monitor-hub/sdk/cmd/plugin-conformance@v0.2.1
          echo "PLUGIN_CONFORMANCE=$RUNNER_TEMP/bin/plugin-conformance" >> "$GITHUB_ENV"

      - uses: Swatinem/rust-cache@v2.9.3

      - name: cargo test
        run: cargo test --locked
