name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: gofmt
        run: test -z "$(gofmt -l .)"

      - name: go vet
        run: go vet ./...

      - name: sqlc output is up to date
        run: go tool sqlc generate && git diff --exit-code -- internal/db

      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15

  test:
    name: Tests (Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: sei_monitor
          POSTGRES_USER: sei_monitor
          POSTGRES_PASSWORD: sei_monitor
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sei_monitor -d sei_monitor"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      rabbitmq:
        image: rabbitmq:4-alpine
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 5s
          --health-timeout 10s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://sei_monitor:sei_monitor@localhost:5432/sei_monitor?sslmode=disable
      TEST_AMQP_URL: amqp://guest:guest@localhost:5672/
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: go test
        run: go test -race ./...

