[package]
name = "sei-monitor"
version = "2.0.0"
edition = "2024"
publish = false

[lib]
name = "sei_monitor"
path = "src/lib.rs"

[dependencies]
bytes = "1.12.1"
chrono = { version = "=0.4.45", default-features = false }
chrono-tz = { version = "=0.10.4", default-features = false }
libc = "0.2.191"
reqwest = { version = "0.13.5", default-features = false, features = ["gzip", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["float_roundtrip"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["io-util", "macros", "process", "sync", "time"] }
unicode-normalization = "=0.1.25"
unicode-properties = { version = "=0.1.4", default-features = false, features = ["general-category"] }
webpki-root-certs = "1.0.11"
zeroize = "1.9.1"

[dev-dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio"] }
base64 = "0.23.1"
encoding_rs = "0.8.42"
flate2 = "1.1.10"
futures-util = { version = "0.3.34", default-features = false, features = ["alloc"] }
tokio = { version = "1.54.1", features = ["net", "rt", "sync"] }
