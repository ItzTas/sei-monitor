[package]
name = "sei-monitor"
version = "2.0.0"
edition = "2024"
publish = false

[lib]
name = "sei_monitor"
path = "src/lib.rs"

[dependencies]
chrono = { version = "=0.4.45", default-features = false }
chrono-tz = { version = "=0.10.4", default-features = false }
libc = "0.2.191"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["io-util", "macros", "process", "time"] }
unicode-properties = { version = "=0.1.4", default-features = false, features = ["general-category"] }
zeroize = "1.9.1"

[dev-dependencies]
tokio = { version = "1.54.1", features = ["rt"] }
