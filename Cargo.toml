[package]
name = "sei-monitor"
version = "2.0.0"
edition = "2024"
publish = false

[lib]
name = "sei_monitor"
path = "src/lib.rs"

[dependencies]
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["io-util", "macros", "process", "time"] }
zeroize = "1.9.1"

[dev-dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt"] }
