services:
  sei-monitor:
    build: .
    image: ghcr.io/itztas/sei-monitor:latest
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    env_file: .env
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - data:/data

  postgres:
    image: postgres:18-alpine
    profiles: [postgres]
    restart: unless-stopped
    environment:
      POSTGRES_DB: sei_monitor
      POSTGRES_USER: sei_monitor
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
    volumes:
      - postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sei_monitor -d sei_monitor"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  data:
  postgres:
