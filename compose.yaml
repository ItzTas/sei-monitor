services:
  sei-monitor:
    build: .
    image: ghcr.io/itztas/sei-monitor:latest
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    env_file: .env
    environment:
      DATABASE_URL: postgres://sei_monitor:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/sei_monitor?sslmode=disable
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: sei_monitor
      POSTGRES_USER: sei_monitor
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sei_monitor -d sei_monitor"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres:
